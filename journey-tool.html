<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFC 顧客ジャーニー台帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2b2b;--bg:#f7f5f0;--card:#fff;--line:#e6e1d8;--accent:#7c2530;--green:#3d7a53;--amber:#a8631f;--gray:#8a8378;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;}
  body{background:var(--bg);color:#232936;}
  header{background:#1a1a1a;color:#fff;padding:13px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:3px solid var(--accent);}
  header h1{font-size:15px;font-weight:700;letter-spacing:.03em;}
  #progress{font-size:12px;opacity:.9;text-align:right;line-height:1.5;}
  #login{max-width:360px;margin:80px auto;background:var(--card);padding:32px;border-radius:14px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  #login button{background:var(--accent);color:#fff;border:0;padding:13px 30px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600;}
  main{max-width:1000px;margin:0 auto;padding:16px;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px solid var(--line);}
  .tab{padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;}
  .toolbar input{flex:1;min-width:170px;}
  .chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip.trigger{border-style:dashed;border-color:var(--amber);color:var(--amber);}
  .chip.trigger.on{background:var(--amber);color:#fff;border-color:var(--amber);border-style:solid;}
  .plist{display:flex;flex-direction:column;gap:8px;}
  .prow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .prow:hover{border-color:var(--accent);}
  .prow .nm{font-weight:700;font-size:14.5px;}
  .prow .sub{font-size:11.5px;color:var(--gray);margin-top:2px;}
  .rightcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .badge{font-size:11px;padding:3px 10px;border-radius:999px;background:#f3e6e8;color:var(--accent);white-space:nowrap;}
  .badge.done{background:#e7f3ec;color:var(--green);}
  .badge.wip{background:#fdf3dd;color:var(--amber);}
  .badge.none{background:#eee9e0;color:var(--gray);}
  .upd{font-size:10px;color:var(--gray);}
  #detail,#cdetail{position:fixed;inset:0;background:rgba(26,20,16,.5);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:28px 12px;z-index:20;}
  #detail.open,#cdetail.open{display:flex;}
  .dcard{background:#fff;border-radius:16px;max-width:660px;width:100%;padding:26px;}
  .dcard h2{font-size:20px;font-weight:900;}
  .dmeta{font-size:12.5px;color:var(--gray);margin:4px 0 14px;}
  .journey{border-left:3px solid var(--accent);margin:14px 0 8px;padding-left:16px;display:flex;flex-direction:column;gap:8px;}
  .jitem{font-size:13.5px;}
  .jitem .yr{font-weight:700;color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums;}
  .jitem .tg{font-size:11px;color:var(--amber);margin-left:6px;}
  .jitem .manual{font-size:10.5px;color:var(--green);margin-left:6px;}
  .addtp{font-size:12.5px;color:var(--accent);cursor:pointer;margin:2px 0 14px 19px;font-weight:600;}
  .tpform{background:#f7f5f0;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 14px;display:none;}
  .tpform.open{display:block;}
  .tpform .row{display:flex;gap:8px;margin-bottom:8px;}
  .tpform input,.tpform select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;flex:1;background:#fff;}
  .tpform button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 20px;font-size:12.5px;cursor:pointer;font-weight:600;}
  .fact{font-size:13px;background:#f7f5f0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .fact b{color:var(--accent);}
  label{font-size:12.5px;font-weight:700;color:var(--ink);display:block;margin:14px 0 6px;}
  select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;}
  textarea{min-height:88px;resize:vertical;}
  .drow{display:flex;gap:10px;}
  .drow>div{flex:1;}
  .actions{display:flex;gap:10px;margin-top:18px;}
  .actions button{flex:1;padding:13px;border-radius:999px;border:0;font-size:14px;cursor:pointer;font-weight:600;}
  #saveBtn{background:var(--accent);color:#fff;}
  #closeBtn{background:#eee9e0;color:var(--ink);}
  #saveMsg{font-size:12px;color:var(--green);text-align:center;margin-top:8px;height:16px;}
  .nav{display:flex;justify-content:space-between;margin-top:10px;}
  .nav button{background:none;border:0;color:var(--accent);font-size:13px;cursor:pointer;padding:6px;font-weight:600;}
  /* tags */
  .tagbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .tagchip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;}
  .tagchip.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tagchip.newbtn{border-style:dashed;color:var(--gray);}
  .listtag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:#efe6d8;color:#6b5a3e;margin-left:4px;}
  .mergebtn{font-size:12px;color:var(--gray);cursor:pointer;font-weight:600;}
  .mergebtn:hover{color:var(--accent);}
  .mergebox{background:#fdf6f6;border:1px solid #e4c9cc;border-radius:10px;padding:12px;margin:8px 0 14px;display:none;}
  .mergebox.open{display:block;}
  .mergebox input{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;}
  .mres{max-height:200px;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .mres div{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:13px;}
  .mres div:hover{border-color:var(--accent);}
  .jedit{font-size:11px;color:var(--gray);cursor:pointer;margin-left:8px;}
  .jedit:hover{color:var(--accent);}
  .jrow{display:flex;align-items:baseline;flex-wrap:wrap;}
  .jeditform{background:#f7f5f0;border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 6px;display:flex;gap:6px;flex-wrap:wrap;}
  .jeditform input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;}
  .jeditform button{border:0;border-radius:999px;padding:7px 16px;font-size:12px;cursor:pointer;font-weight:600;}
  .jeditform .savebtn{background:var(--accent);color:#fff;}
  .jeditform .delbtn{background:#eee;color:#a33;}
  .jeditform .cancelbtn{background:#eee9e0;}
  /* corp */
  .crow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .crow:hover{border-color:var(--accent);}
  .crow .nm{font-weight:700;font-size:14.5px;}
  .crow .sub{font-size:11.5px;color:var(--gray);margin-top:2px;}
  .cstat{font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .cstat.進行中{background:#e7f3ec;color:var(--green);}
  .cstat.保留{background:#fdf3dd;color:var(--amber);}
  .cstat.終了{background:#eee9e0;color:var(--gray);}
  .cstat.打ち切り{background:#f6e3e3;color:#a33;}
  .histbox{background:#f7f5f0;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;max-height:120px;overflow:hidden;position:relative;}
  .histbox.expanded{max-height:none;}
  .histmore{font-size:12px;color:var(--accent);cursor:pointer;font-weight:600;margin-top:4px;}
  .histlabel{font-size:11px;color:var(--gray);margin-bottom:4px;}
  .evrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline;}
  .evym{font-weight:700;color:var(--accent);min-width:62px;font-variant-numeric:tabular-nums;}
  .evdel{margin-left:auto;color:var(--gray);cursor:pointer;font-size:11px;}
  .evdel:hover{color:#a33;}
  .linkperson{font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:4px 0;cursor:pointer;}
  .linkperson:hover{border-color:var(--accent);}
  /* timeline */
  .tlrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .tlym{font-weight:700;color:var(--accent);min-width:66px;font-variant-numeric:tabular-nums;}
  .tlkind{font-size:10.5px;padding:2px 8px;border-radius:999px;background:#efe6d8;color:#6b5a3e;white-space:nowrap;}
  .tldel{margin-left:auto;color:var(--gray);cursor:pointer;font-size:11px;}
  .tldel:hover{color:#a33;}
  .tlform{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .tlform input,.tlform select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;}
  .tlform button{border:0;border-radius:999px;padding:8px 18px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;}
  .yearbar{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;}
  .yearbar .lbl{min-width:44px;font-weight:700;font-variant-numeric:tabular-nums;}
  .yearbar .b1{height:13px;background:var(--accent);border-radius:3px;}
  .yearbar .b2{height:13px;background:#c9a227;border-radius:3px;}
  .yearbar .b3{height:13px;background:#3d7a53;border-radius:3px;}
  .yearev{font-size:11px;color:#6b5a3e;margin:1px 0 5px 52px;}
  /* analytics */
  .insight{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;}
  .insight h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);}
  th{font-size:11.5px;color:var(--gray);font-weight:700;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .bar{height:14px;background:var(--accent);border-radius:3px;display:inline-block;vertical-align:middle;min-width:2px;}
</style>
</head>
<body>
<header>
  <h1>RFC 顧客ジャーニー台帳</h1>
  <div id="progress"></div>
</header>

<div id="login">
  <p style="margin-bottom:18px;font-size:14px;">Googleアカウントでログイン</p>
  <button onclick="signIn()">ログイン</button>
</div>

<main id="app" style="display:none">
  <div class="tabs">
    <div class="tab on" data-tab="list" onclick="switchTab('list')">名簿</div>
    <div class="tab" data-tab="corp" onclick="switchTab('corp')">法人</div>
    <div class="tab" data-tab="analytics" onclick="switchTab('analytics')">分析</div>
  </div>

  <div id="listView">
    <div class="toolbar">
      <input id="q" placeholder="名前・メール・プログラムで検索" oninput="render()">
      <select id="yearF" onchange="render()"><option value="">初回年: 全て</option></select>
      <select id="statusF" onchange="render()">
        <option value="">記入状況: 全て</option>
        <option value="未着手">未着手のみ</option>
        <option value="途中">途中のみ</option>
        <option value="完了">完了のみ</option>
      </select>
      <button onclick="addPerson()" style="padding:9px 18px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">＋ 新しい人を追加</button>
      <select id="sortF" onchange="render()">
        <option value="recent">並び: 最終接触が新しい順</option>
        <option value="old">並び: 初回接触が古い順</option>
        <option value="count">並び: 受講回数が多い順</option>
      </select>
    </div>
    <div class="toolbar" id="chips"></div>
    <div class="toolbar" id="triggerChips"></div>
    <div class="toolbar" id="tagFilterChips"></div>
    <div class="plist" id="list"></div>
  </div>

  <div id="corpView" style="display:none">
    <div class="toolbar">
      <input id="cq" placeholder="法人名・担当者・メモで検索" oninput="renderCorp()">
      <select id="cStatusF" onchange="renderCorp()"><option value="">ステータス: 全て</option></select>
      <button onclick="addCorp()" style="padding:9px 18px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">＋ 新しい法人を追加</button>
    </div>
    <div class="plist" id="corpList"></div>
  </div>
  <div id="analyticsView" style="display:none"></div>
</main>

<div id="cdetail" onclick="if(event.target===this)closeCorp()">
  <div class="dcard">
    <h2 id="cName"></h2>
    <div class="dmeta" id="cMeta"></div>
    <div style="display:flex;gap:16px;margin-bottom:10px;">
      <div class="mergebtn" onclick="corpToPerson()">→ 個人に移す（法人としての関わりが無い場合）</div>
      <div class="mergebtn" onclick="deleteCorp()" style="color:#a33;">🗑 このレコードを削除</div>
    </div>
    <div class="drow">
      <div><label>法人名</label>
        <input id="cNameEdit" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;"></div>
      <div><label>窓口担当・代表者（先方）</label>
        <input id="cContact" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;" placeholder="例: 清水隆志さん"></div>
    </div>
    <label>RFC側の責任者</label>
    <input id="cOwner" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;">
    <div id="cFacts"></div>
    <label>活動記録（新しいことがあったら足していく）</label>
    <div id="cEvents"></div>
    <div class="tlform">
      <input id="evYm" placeholder="2026-07" style="width:100px">
      <input id="evTitle" placeholder="何があったか（例: 経営会議で提案）" style="flex:1;min-width:200px">
      <button onclick="addCorpEvent()">追加</button>
    </div>
    <label>現状サマリー（1〜2行。今どうなっているか）</label>
    <input id="cSummary" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;">
    <label>この法人に関係する個人（受講者・担当者）</label>
    <div id="cLinked"></div>
    <div class="mergebtn" onclick="toggleLinkBox()" style="margin:6px 0;">＋ 個人を紐づける（過去の受講者・担当者を探す）</div>
    <div class="mergebox" id="linkBox">
      <div style="font-size:12px;color:var(--gray);margin-bottom:6px;">選んだ人の「所属・関連法人」にこの法人名が入り、双方向で行き来できるようになります。</div>
      <input id="linkQ" placeholder="名前・メールで検索" oninput="renderLinkResults()">
      <div class="mres" id="linkResults"></div>
    </div>
    <div id="cHistory"></div>
    <div class="drow">
      <div><label>ステータス</label>
        <select id="cStatus"><option value="">（未記入）</option><option>進行中</option><option>保留</option><option>終了</option><option>打ち切り</option><option>単発のみ</option></select>
      </div>
      <div><label>属性</label>
        <select id="cAttr"><option value="">（未記入）</option><option>既得意</option><option>潜在</option></select>
      </div>
    </div>
    <label>次のアクション</label>
    <input id="cNext" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;">
    <label>作業メモ（自由に書き換えてOK）</label>
    <textarea id="cNote"></textarea>
    <div class="actions">
      <button id="closeBtn" onclick="closeCorp()">閉じる</button>
      <button id="saveBtn" onclick="saveCorp()">保存</button>
    </div>
    <div id="cSaveMsg" style="font-size:12px;color:var(--green);text-align:center;margin-top:8px;height:16px;"></div>
  </div>
</div>

<div id="detail" onclick="if(event.target===this)closeDetail()">
  <div class="dcard">
    <h2 id="dName"></h2>
    <div class="dmeta" id="dMeta"></div>
    <div id="dFacts"></div>
    <div class="journey" id="dJourney"></div>
    <div class="addtp" onclick="toggleTpForm()">＋ 接点を追加（パーソナルコンサル・面談・その他）</div>
    <div style="display:flex;gap:16px;margin:2px 0 6px 19px;">
      <div class="mergebtn" onclick="toggleMerge()">⇄ この人を別の人に統合する（同一人物・旧姓など）</div>
      <div class="mergebtn" onclick="personToCorp()">🏢 法人レコードを作る（取引が始まった）</div>
      <div class="mergebtn" onclick="deletePerson()" style="color:#a33;">🗑 このレコードを削除</div>
    </div>
    <div class="mergebox" id="mergeBox">
      <div style="font-size:12px;color:var(--gray);margin-bottom:6px;">この人の履歴を、選んだ人にまとめます。<b>この人のレコードは削除されます。</b></div>
      <input id="mergeQ" placeholder="統合先の人を名前で検索" oninput="renderMergeResults()">
      <div class="mres" id="mergeResults"></div>
    </div>
    <div class="tpform" id="tpForm">
      <div class="row">
        <input id="tpYear" placeholder="年 (例: 2026)" style="max-width:110px">
        <input id="tpProgram" placeholder="接点の内容 (例: パーソナルコンサルティング)">
      </div>
      <div class="row">
        <input id="tpNote" placeholder="メモ (任意)">
        <button onclick="addTouchpoint()">追加</button>
      </div>
    </div>
    <div class="drow">
      <div>
        <label>氏名（表記の修正）</label>
        <input id="dNameEdit" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;">
      </div>
      <div>
        <label>メールアドレス</label>
        <input id="dEmailEdit" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;" placeholder="(不明の場合は空欄)">
      </div>
    </div>
    <div class="drow">
      <div>
        <label>認知チャネル（どこで知ったか）</label>
        <select id="dChannel"><option value="">（未記入）</option><option>書籍</option><option>紹介</option><option>Podcast</option><option>読書会</option><option>創造プロセス倶楽部</option><option>ロバート来日WS</option><option>STARクラブ/道場</option><option>セミナー・登壇</option><option>Web検索</option><option>SNS</option><option>その他</option></select>
      </div>
      <div>
        <label>知った年（だいたいで可）</label>
        <input id="dAware" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;" placeholder="例: 2019">
      </div>
    </div>
    <label>紹介者（紹介の場合、誰から）</label>
    <input id="dReferrer" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;" placeholder="例: 松岡克政さん">
    <label>所属・関連法人（きっかけになった企業/NPOなど）</label>
    <input id="dCompany" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;" placeholder="例: NPO法人◯◯、株式会社△△">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
      <input type="checkbox" id="dInternal" style="width:16px;height:16px;accent-color:var(--accent);">
      内部メンバー（RFC運営側。リストと分析から除外されます）
    </label>
    <div class="drow">
      <div>
        <label>現在の状態</label>
        <select id="dStatus">
          <option value="">（未記入）</option>
          <option>能動的に創造している</option>
          <option>学び続けている</option>
          <option>接点はあるが動きなし</option>
          <option>離脱</option>
          <option>不明・思い出せない</option>
        </select>
      </div>
      <div>
        <label>記入ステータス</label>
        <select id="dReview">
          <option>未着手</option>
          <option>途中</option>
          <option>完了</option>
        </select>
      </div>
    </div>
    <label>タグ（イベント招待・興味・意図の印。タップで付け外し）</label>
    <div class="tagbox" id="dTags"></div>
    <label>メモ（きっかけ・関係・その後のこと、Dannaに聞くことなど）</label>
    <textarea id="dNote"></textarea>
    <div class="actions">
      <button id="closeBtn" onclick="closeDetail()">閉じる</button>
      <button id="saveBtn" onclick="save()">保存</button>
    </div>
    <div id="saveMsg"></div>
    <div class="nav">
      <button onclick="step(-1)">← 前の人</button>
      <button onclick="step(1)">次の人（保存して移動）</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://googdxrbzgwdwzimehio.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_st8Ylnt61zDYX0ogwz7mpw_3x1t-Tzk";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let persons=[], tpsByPerson={}, current=null, filtered=[];
let routeFilter="", triggerFilter="", tagFilter="", userEmail="", jpFirst=true, showInternal=false;
let initiatives=[], corps=[], currentCorp=null, corpEvents={};

async function signIn(){ await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}}); }
sb.auth.onAuthStateChange(async (_e,session)=>{ if(session){ userEmail=session.user.email||''; document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; await load(); } });

let loading=false;
async function load(){
  if(loading)return; loading=true;
  try{ await loadInner(); } finally { loading=false; }
}
async function loadInner(){
  let all=[], from=0;
  while(true){ const {data,error}=await sb.from('persons').select('*').range(from,from+999); if(error){alert(error.message);return;} all=all.concat(data); if(data.length<1000)break; from+=1000; }
  persons=all;
  let tps=[], f2=0;
  while(true){ const {data}=await sb.from('touchpoints').select('*').range(f2,f2+999); tps=tps.concat(data); if(data.length<1000)break; f2+=1000; }
  tpsByPerson={};
  tps.forEach(t=>{(tpsByPerson[t.person_id]=tpsByPerson[t.person_id]||[]).push(t);});
  Object.values(tpsByPerson).forEach(a=>a.sort((x,y)=>(x.year||'9999').localeCompare(y.year||'9999')));
  const years=[...new Set(persons.map(p=>p.first_year).filter(Boolean))].sort();
  const yf=document.getElementById('yearF');
  yf.innerHTML='<option value="">初回年: 全て</option>';
  years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent='初回 '+y;yf.appendChild(o);});
  const cp=await sb.from('corporate_clients').select('*');
  corps=(cp.data||[]);
  const csf=document.getElementById('cStatusF');
  csf.innerHTML='<option value="">ステータス: 全て</option>';
  [...new Set(corps.map(c=>c.status).filter(Boolean))].sort().forEach(s=>{
    const o=document.createElement('option');o.value=s;o.textContent=s;csf.appendChild(o);});
  const ce=await sb.from('corp_events').select('*');
  corpEvents={};
  (ce.data||[]).forEach(e=>{(corpEvents[e.client_id]=corpEvents[e.client_id]||[]).push(e);});
  const ini=await sb.from('initiatives').select('*');
  initiatives=(ini.data||[]).sort((a,b)=>(a.ym||'').localeCompare(b.ym||''));
  buildChips(); render();
}

// trigger definitions
const TRIGGERS = {
  'FSTで止まっている': p => {
    const tp=(tpsByPerson[p.id]||[]).map(t=>t.program).join(' ');
    return /FST|創り出す思考/.test(tp) && !/SCCP|FBS/.test(tp);
  },
  '倶楽部/前史のみ': p => routeOf(p)==='入口接点のみ(倶楽部・前史)',
  '1回きりで終了': p => (tpsByPerson[p.id]||[]).length===1,
  '4年以上継続': p => p.first_year && p.last_year && (parseInt(p.last_year)-parseInt(p.first_year))>=4,
  '2年以上動きなし': p => p.last_year && parseInt(p.last_year) <= 2024,
};

function buildChips(){
  const types=[...new Set(persons.map(p=>routeOf(p)))].sort();
  const el=document.getElementById('chips'); el.innerHTML='';
  const mk=(label,val)=>{const c=document.createElement('div');c.className='chip'+(routeFilter===val?' on':'');c.textContent=label;
    c.onclick=()=>{routeFilter=val;buildChips();render();};el.appendChild(c);};
  mk('全経路','');
  types.forEach(t=>mk(t,t));
  const jc=document.createElement('div');
  jc.className='chip'+(jpFirst?'':' on');
  jc.textContent=jpFirst?'🌐 海外は末尾':'🌐 海外も混在';
  jc.onclick=()=>{jpFirst=!jpFirst;buildChips();render();};
  el.appendChild(jc);
  const ic=document.createElement('div');
  ic.className='chip'+(showInternal?' on':'');
  ic.textContent='👥 内部メンバー'+(showInternal?'表示中':'非表示');
  ic.onclick=()=>{showInternal=!showInternal;buildChips();render();};
  el.appendChild(ic);
  const el2=document.getElementById('triggerChips'); el2.innerHTML='';
  const mk2=(label)=>{const c=document.createElement('div');c.className='chip trigger'+(triggerFilter===label?' on':'');c.textContent='🔎 '+label;
    c.onclick=()=>{triggerFilter=(triggerFilter===label?'':label);buildChips();render();};el2.appendChild(c);};
  Object.keys(TRIGGERS).forEach(mk2);
  const el3=document.getElementById('tagFilterChips'); el3.innerHTML='';
  const tags=allTags();
  if(tags.length){
    tags.forEach(t=>{
      const n=persons.filter(p=>(p.tags||'').split(',').map(x=>x.trim()).includes(t)).length;
      const c=document.createElement('div');c.className='chip'+(tagFilter===t?' on':'');c.textContent=`🏷 ${t} (${n})`;
      c.onclick=()=>{tagFilter=(tagFilter===t?'':t);buildChips();render();};el3.appendChild(c);
    });
  }
}

// 入口接点(ソフトな接点)の判定パターン
const SOFT_RE = /創造プロセス倶楽部|STARクラブ|STAR ?クラブ|ディベート道場|読書会|メルマガ/;
function routeOf(p){
  const tp=(tpsByPerson[p.id]||[]);
  const hasCourse = tp.some(t=>!SOFT_RE.test(t.program||''));
  if(hasCourse) return '講座受講';
  const hasSoft = tp.length>0 || (p.prehistory||'').trim();
  if(hasSoft) return '入口接点のみ(倶楽部・前史)';
  return '記録薄';
}
function isJP(n){ return /[\u3040-\u30ff\u3400-\u9fff]/.test(n||''); }
function fmtDate(iso){ if(!iso)return ''; const d=new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const yf=document.getElementById('yearF').value;
  const sf=document.getElementById('statusF').value;
  const sort=document.getElementById('sortF').value;
  filtered=persons.filter(p=>{
    if(!showInternal && p.is_internal)return false;
    if(routeFilter && routeOf(p)!==routeFilter)return false;
    if(yf && p.first_year!==yf)return false;
    if(sf && (p.review_status||'未着手')!==sf)return false;
    if(triggerFilter && !TRIGGERS[triggerFilter](p))return false;
    if(tagFilter && !(p.tags||'').split(',').map(x=>x.trim()).includes(tagFilter))return false;
    if(q){ const tp=(tpsByPerson[p.id]||[]).map(t=>t.program).join(' ');
      const hay=(p.name+' '+(p.email||'')+' '+tp+' '+(p.prehistory||'')+' '+(p.memory_note||'')+' '+(p.company||'')+' '+(p.referrer||'')+' '+(p.channel||'')+' '+(p.tags||'')).toLowerCase();
      if(!hay.includes(q))return false; }
    return true;
  });
  if(sort==='recent') filtered.sort((a,b)=>(b.last_year||'').localeCompare(a.last_year||'')|| (b.first_year||'').localeCompare(a.first_year||''));
  else if(sort==='old') filtered.sort((a,b)=>(a.first_year||'9999').localeCompare(b.first_year||'9999'));
  else filtered.sort((a,b)=>(tpsByPerson[b.id]||[]).length-(tpsByPerson[a.id]||[]).length);
  if(jpFirst) filtered.sort((a,b)=>(isJP(a.name)?0:1)-(isJP(b.name)?0:1));

  const done=persons.filter(p=>p.review_status==='完了').length;
  const wip=persons.filter(p=>p.review_status==='途中').length;
  document.getElementById('progress').innerHTML=`完了 ${done} ・ 途中 ${wip} / ${persons.length}人<br><span style="font-size:10px;opacity:.7">表示中: ${filtered.length}人</span>`;
  const list=document.getElementById('list'); list.innerHTML='';
  filtered.slice(0,300).forEach(p=>{
    const div=document.createElement('div');div.className='prow';
    const tp=(tpsByPerson[p.id]||[]);
    const rs=p.review_status||'未着手';
    const rsClass=rs==='完了'?'done':(rs==='途中'?'wip':'none');
    const stBadge=p.current_status?`<span class="badge done">${p.current_status}</span>`:'';
    const upd=p.updated_by?`<span class="upd">${fmtDate(p.updated_at)} ${p.updated_by.split('@')[0]}</span>`:'';
    const compSub=p.company?` ・ ${p.company}`:'';
    const tagSub=(p.tags||'').split(',').map(x=>x.trim()).filter(Boolean).map(t=>`<span class="listtag">${t}</span>`).join('');
    div.innerHTML=`<div><div class="nm">${p.name}</div><div class="sub">${p.first_year||'?'}〜${p.last_year||'?'} ・ ${tp.length}接点${compSub} ・ ${p.email||'email不明'}</div></div>
      <div class="rightcol"><span class="badge ${rsClass}">${rs}</span>${stBadge}<div>${tagSub}</div>${upd}</div>`;
    div.onclick=()=>openDetail(p.id);
    list.appendChild(div);
  });
}

function openDetail(id){
  current=persons.find(p=>p.id===id);
  document.getElementById('dName').textContent=current.name;
  const upd=current.updated_by?` ・ 最終更新 ${fmtDate(current.updated_at)}（${current.updated_by.split('@')[0]}）`:'';
  const comp=current.company?` ・ ${current.company}`:'';
  document.getElementById('dMeta').textContent=`${current.email||'email不明'}${comp} ・ ${routeOf(current)}${upd}`;
  let facts='';
  if(current.kikkake)facts+=`<div class="fact"><b>知ったきっかけ:</b> ${current.kikkake}</div>`;
  if(current.purpose)facts+=`<div class="fact"><b>初回の参加目的:</b> ${current.purpose}</div>`;
  if(current.prehistory)facts+=`<div class="fact"><b>前史(STARクラブ/道場):</b> ${current.prehistory}</div>`;
  if(current.personal_consulting)facts+=`<div class="fact"><b>パーソナルコンサルティング</b> 実施あり</div>`;
  if(current.company){
    const key=current.company.replace(/株式会社|有限会社|一般社団法人|NPO法人|学校法人|\s/g,'');
    const hit=corps.find(c=>{const n=(c.client_name||'').replace(/株式会社|有限会社|一般社団法人|NPO法人|学校法人|\s/g,'');
      return n&&key&&(n.includes(key)||key.includes(n));});
    if(hit)facts+=`<div class="fact"><b>法人クライアント:</b> ${hit.client_name}（${hit.status||'状態未記入'}）<span style="color:var(--accent);cursor:pointer;margin-left:8px" onclick="closeDetail();switchTab('corp');openCorp(${hit.id})">→ 法人カードを見る</span></div>`;
  }
  document.getElementById('dFacts').innerHTML=facts;
  renderJourney(id);
  document.getElementById('tpForm').classList.remove('open');
  document.getElementById('dInternal').checked=!!current.is_internal;
  document.getElementById('dNameEdit').value=current.name||'';
  document.getElementById('dEmailEdit').value=current.email||'';
  currentTags=(current.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
  renderTagBox();
  document.getElementById('dChannel').value=current.channel||'';
  document.getElementById('dAware').value=current.aware_year||'';
  document.getElementById('dReferrer').value=current.referrer||'';
  document.getElementById('dCompany').value=current.company||'';
  document.getElementById('dStatus').value=current.current_status||'';
  document.getElementById('dReview').value=current.review_status||'未着手';
  document.getElementById('dNote').value=current.memory_note||'';
  document.getElementById('saveMsg').textContent='';
  document.getElementById('detail').classList.add('open');
}
let editingTpId=null;
function renderJourney(id){
  const j=document.getElementById('dJourney'); j.innerHTML='';
  (tpsByPerson[id]||[]).forEach(t=>{
    const d=document.createElement('div');d.className='jitem';
    if(editingTpId===t.id){
      d.innerHTML=`<div class="jeditform">
        <input id="etYear" value="${t.year||''}" placeholder="年" style="width:70px">
        <input id="etProgram" value="${(t.program||'').replace(/"/g,'&quot;')}" placeholder="内容" style="flex:1;min-width:150px">
        <input id="etNote" value="${(t.note||'').replace(/"/g,'&quot;')}" placeholder="メモ" style="flex:1;min-width:120px">
        <button class="savebtn" onclick="saveTp(${t.id})">保存</button>
        <button class="delbtn" onclick="deleteTp(${t.id})">削除</button>
        <button class="cancelbtn" onclick="editingTpId=null;renderJourney(${id})">取消</button>
      </div>`;
    }else{
      const manual=t.source==='手入力'?`<span class="manual">✎手入力${t.added_by?'('+t.added_by.split('@')[0]+')':''}</span>`:'';
      const edited=t.note&&t.note.includes('[修正済')?`<span class="manual">✎修正済</span>`:'';
      d.innerHTML=`<div class="jrow"><span class="yr">${t.year||'—'}</span><span>${t.program}</span>${t.tag?`<span class="tg">[${t.tag}]</span>`:''}${manual}${edited}${t.note?` <span style="color:var(--gray);font-size:12px">— ${t.note}</span>`:''}<span class="jedit" onclick="editingTpId=${t.id};renderJourney(${id})">編集</span></div>`;
    }
    j.appendChild(d);
  });
}
async function saveTp(tpId){
  const year=document.getElementById('etYear').value.trim();
  const program=document.getElementById('etProgram').value.trim();
  let note=document.getElementById('etNote').value.trim();
  if(!program){alert('内容は空にできません');return;}
  const t=(tpsByPerson[current.id]||[]).find(x=>x.id===tpId);
  const isOrig=t&&t.source!=='手入力';
  if(isOrig&&!note.includes('[修正済'))note=(note?note+' ':'')+`[修正済:${userEmail.split('@')[0]}]`;
  const {error}=await sb.from('touchpoints').update({year:year||null,program,note}).eq('id',tpId);
  if(error){alert(error.message);return;}
  Object.assign(t,{year:year||null,program,note});
  tpsByPerson[current.id].sort((x,y)=>(x.year||'9999').localeCompare(y.year||'9999'));
  editingTpId=null;
  await syncYears(current.id);
  renderJourney(current.id);
}
async function deleteTp(tpId){
  if(!confirm('この接点を削除しますか？（元に戻せません）'))return;
  const {error}=await sb.from('touchpoints').delete().eq('id',tpId);
  if(error){alert(error.message);return;}
  tpsByPerson[current.id]=(tpsByPerson[current.id]||[]).filter(x=>x.id!==tpId);
  editingTpId=null;
  await syncYears(current.id);
  renderJourney(current.id);
}
function allTags(){
  const s=new Set();
  persons.forEach(p=>(p.tags||'').split(',').forEach(t=>{t=t.trim();if(t)s.add(t);}));
  return [...s].sort();
}
let currentTags=[];
function renderTagBox(){
  const box=document.getElementById('dTags'); box.innerHTML='';
  const tags=[...new Set([...allTags(), ...currentTags])].sort();
  tags.forEach(t=>{
    const c=document.createElement('div');
    c.className='tagchip'+(currentTags.includes(t)?' sel':'');
    c.textContent=t;
    c.onclick=()=>{ if(currentTags.includes(t))currentTags=currentTags.filter(x=>x!==t); else currentTags.push(t); renderTagBox(); };
    box.appendChild(c);
  });
  const nb=document.createElement('div');
  nb.className='tagchip newbtn'; nb.textContent='＋ 新規タグを作成';
  nb.onclick=()=>{
    const name=prompt('新しいタグ名（イベント系は年を付けると便利: 例 忘年会2026）');
    if(!name)return;
    const nm=name.trim();
    if(!nm)return;
    const similar=allTags().find(t=>t.replace(/[0-9]/g,'')===nm.replace(/[0-9]/g,'')&&t!==nm);
    if(similar && !confirm(`似たタグ「${similar}」があります。それでも「${nm}」を新規作成しますか？\n（キャンセルして既存タグを使うことをおすすめします）`))return;
    if(!currentTags.includes(nm))currentTags.push(nm);
    renderTagBox();
  };
  box.appendChild(nb);
}
async function personToCorp(){
  const p=current;
  const norm=s=>(s||'').replace(/株式会社|有限会社|一般社団法人|NPO法人|学校法人|\s|　/g,'');
  const existing=corps.find(c=>{
    const a=norm(c.client_name), b=norm(p.company);
    return a&&b&&(a.includes(b)||b.includes(a));
  });
  if(existing){
    if(confirm(`「${existing.client_name}」の法人レコードが既にあります。そちらを開きますか？`)){
      closeDetail(); switchTab('corp'); openCorp(existing.id);
    }
    return;
  }
  const name=prompt('法人名を入力してください', p.company||'');
  if(!name||!name.trim())return;
  const now=new Date();
  const ym=`${now.getFullYear()}年${now.getMonth()+1}月`;
  const {data,error}=await sb.from('corporate_clients').insert({
    client_name:name.trim(), contact_person:p.name, status:'進行中', attribute:'既得意',
    contact_start:ym, current_summary:`個人受講者からの法人化（${p.name}）`,
    updated_at:now.toISOString()
  }).select();
  if(error){alert('作成できませんでした: '+error.message);return;}
  corps.push(data[0]); corpEvents[data[0].id]=[];
  // 個人側の所属も揃える
  if(norm(p.company)!==norm(name)){
    const upd={company:name.trim(), updated_by:userEmail, updated_at:now.toISOString()};
    await sb.from('persons').update(upd).eq('id',p.id);
    Object.assign(p,upd);
  }
  closeDetail(); switchTab('corp'); openCorp(data[0].id);
  alert('法人レコードを作成し、この人を窓口担当として紐づけました。個人のレコードはそのまま残っています。');
}
async function deletePerson(){
  const n=(tpsByPerson[current.id]||[]).length;
  const msg=n>0
    ? `「${current.name}」を削除します。\n\n⚠ 接点 ${n}件 も一緒に消えます。\n同一人物の重複であれば「統合」を使うと履歴が残ります。\n\n本当に削除しますか？`
    : `「${current.name}」を削除します。よろしいですか？`;
  if(!confirm(msg))return;
  if(n>0 && !confirm('もう一度確認します。接点も含めて完全に削除します。よろしいですか？'))return;
  const {error}=await sb.from('persons').delete().eq('id',current.id);
  if(error){alert('削除できませんでした: '+error.message);return;}
  persons=persons.filter(p=>p.id!==current.id);
  delete tpsByPerson[current.id];
  closeDetail();
  buildChips(); render();
}
async function syncYears(pid){
  const p=persons.find(x=>x.id===pid); if(!p)return;
  const ys=(tpsByPerson[pid]||[]).map(t=>(t.year||'').slice(0,4)).filter(Boolean).sort();
  const upd={ first_year: ys.length?ys[0]:'', last_year: ys.length?ys[ys.length-1]:'' };
  if(p.first_year===upd.first_year && p.last_year===upd.last_year)return;
  const {error}=await sb.from('persons').update(upd).eq('id',pid);
  if(!error)Object.assign(p,upd);
}
function toggleMerge(){
  const b=document.getElementById('mergeBox');
  b.classList.toggle('open');
  if(b.classList.contains('open')){document.getElementById('mergeQ').value='';renderMergeResults();document.getElementById('mergeQ').focus();}
}
function renderMergeResults(){
  const q=(document.getElementById('mergeQ').value||'').trim().toLowerCase();
  const box=document.getElementById('mergeResults'); box.innerHTML='';
  if(!q){box.innerHTML='<div style="border:0;color:#999;cursor:default">名前を入力してください</div>';return;}
  const hits=persons.filter(p=>p.id!==current.id && ((p.name||'')+' '+(p.email||'')).toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){box.innerHTML='<div style="border:0;color:#999;cursor:default">該当なし</div>';return;}
  hits.forEach(p=>{
    const n=(tpsByPerson[p.id]||[]).length;
    const el=document.createElement('div');
    el.innerHTML=`<b>${p.name}</b> <span style="color:#999">${p.email||'email不明'} ・ ${n}接点</span>`;
    el.onclick=()=>doMerge(p.id);
    box.appendChild(el);
  });
}
async function doMerge(targetId){
  const src=current, dst=persons.find(p=>p.id===targetId);
  if(!confirm(`「${src.name}」を「${dst.name}」に統合します。\n\n・${src.name} の接点 ${(tpsByPerson[src.id]||[]).length}件 は ${dst.name} に移ります\n・${src.name} のレコードは削除されます\n\n実行しますか？`))return;
  let {error}=await sb.from('touchpoints').update({person_id:targetId}).eq('person_id',src.id);
  if(error){alert('接点の移動に失敗: '+error.message);return;}
  const pick=(a,b)=>(a&&String(a).trim())?a:(b||'');
  const tags=[...new Set([...(dst.tags||'').split(','),...(src.tags||'').split(',')].map(s=>s.trim()).filter(Boolean))].join(', ');
  const note=[dst.memory_note, src.memory_note, `[統合] ${src.name} ${src.email||'(email無)'}`].filter(x=>x&&String(x).trim()).join('\n');
  const merged={
    email:pick(dst.email,src.email), company:pick(dst.company,src.company),
    channel:pick(dst.channel,src.channel), referrer:pick(dst.referrer,src.referrer),
    aware_year:pick(dst.aware_year,src.aware_year), prehistory:pick(dst.prehistory,src.prehistory),
    current_status:pick(dst.current_status,src.current_status),
    review_status:pick(dst.review_status,src.review_status),
    personal_consulting:!!(dst.personal_consulting||src.personal_consulting),
    tags, memory_note:note, updated_by:userEmail, updated_at:new Date().toISOString()
  };
  const moved=(tpsByPerson[src.id]||[]);

async function corpToPerson(){
  const c=currentCorp;
  const guess=(c.contact_person||c.client_name||'').replace(/[（(].*?[）)]/g,'').replace(/さん$/,'').trim();
  const name=prompt('個人として登録する氏名', guess);
  if(!name||!name.trim())return;
  const nm=name.trim();
  // 既存の個人を探す
  const norm=s=>(s||'').replace(/[（(].*?[）)]/g,'').replace(/\s|　/g,'');
  const hit=persons.find(p=>norm(p.name)===norm(nm));
  let targetId=null;
  if(hit){
    if(confirm(`既に「${hit.name}」が個人DBにあります。\nこの法人の記録をその人にまとめますか？\n\n「キャンセル」を選ぶと新しく別の個人として登録します。`)) targetId=hit.id;
  }
  // 記録をまとめる
  const noteParts=[];
  if(c.client_name && norm(c.client_name)!==norm(nm)) noteParts.push(`[法人DBから移動] 元の登録名: ${c.client_name}`);
  if(c.current_summary) noteParts.push(c.current_summary);
  if(c.next_action) noteParts.push('次のアクション: '+c.next_action);
  if(c.notes) noteParts.push('--- 旧Notes ---\n'+c.notes);
  if(c.process_detail) noteParts.push('--- プロセス・詳細 ---\n'+c.process_detail);
  const note=noteParts.join('\n\n');

  if(!targetId){
    const {data,error}=await sb.from('persons').insert({
      name:nm, company:'', channel:'', current_status:'',
      memory_note:note, updated_by:userEmail, updated_at:new Date().toISOString()
    }).select();
    if(error){alert('個人の作成に失敗: '+error.message);return;}
    targetId=data[0].id; persons.push(data[0]); tpsByPerson[targetId]=[];
  }else{
    const p=persons.find(x=>x.id===targetId);
    const merged=[p.memory_note,note].filter(x=>x&&String(x).trim()).join('\n\n');
    const {error}=await sb.from('persons').update({memory_note:merged,updated_by:userEmail,updated_at:new Date().toISOString()}).eq('id',targetId);
    if(error){alert(error.message);return;}
    p.memory_note=merged;
  }
  // 活動記録 → 接点
  const evs=corpEvents[c.id]||[];
  const initial=[];
  if(c.contact_start){
    const m=String(c.contact_start).match(/(20\d\d)[年\/\-]?\s?(\d{1,2})?/);
    if(m) initial.push({year: m[2]? `${m[1]}-${String(m[2]).padStart(2,'0')}` : m[1],
                        title:`コンタクト開始（元:法人DB ${c.client_name}）`});
  }
  const toInsert=[...initial.map(x=>({person_id:targetId,year:x.year,program:x.title,source:'法人DBから移動',note:''})),
                  ...evs.map(e=>({person_id:targetId,year:e.ym,program:e.title,source:'法人DBから移動',note:e.note||''}))];
  if(toInsert.length){
    const {data,error}=await sb.from('touchpoints').insert(toInsert).select();
    if(error){alert('接点の移動に失敗: '+error.message);return;}
    tpsByPerson[targetId]=[...(tpsByPerson[targetId]||[]),...data];
  }
  // 法人レコード削除
  const {error:delErr}=await sb.from('corporate_clients').delete().eq('id',c.id);
  if(delErr){alert('法人レコードの削除に失敗: '+delErr.message);return;}
  corps=corps.filter(x=>x.id!==c.id); delete corpEvents[c.id];
  await syncYears(targetId);
  closeCorp();
  switchTab('list');
  openDetail(targetId);
  alert('個人に移しました');
}

function renderAnalytics(){
  const v=document.getElementById('analyticsView');
  const persons_all=persons;
  const persons_a=persons.filter(p=>!p.is_internal);
  const byYear={};
  persons_a.forEach(p=>{ if(!p.first_year)return; (byYear[p.first_year]=byYear[p.first_year]||[]).push(p); });
  const years=Object.keys(byYear).sort();
  const maxN=Math.max(...years.map(y=>byYear[y].length));
  let cohortRows='';
  years.forEach(y=>{
    const g=byYear[y];
    const multi=g.filter(p=>(tpsByPerson[p.id]||[]).length>=3).length;
    const recent=g.filter(p=>p.last_year&&parseInt(p.last_year)>=2025).length;
    cohortRows+=`<tr><td>${y}</td><td class="num">${g.length}</td>
      <td><span class="bar" style="width:${Math.round(g.length/maxN*160)}px"></span></td>
      <td class="num">${multi} (${Math.round(multi/g.length*100)}%)</td>
      <td class="num">${recent} (${Math.round(recent/g.length*100)}%)</td></tr>`;
  });
  // FST→next conversion
  let fstOnly=0,fstToSccp=0,fstToFbs=0,fstTotal=0;
  persons_a.forEach(p=>{
    const tp=(tpsByPerson[p.id]||[]).map(t=>t.program).join(' ');
    if(/FST|創り出す思考/.test(tp)){ fstTotal++;
      if(/SCCP/.test(tp))fstToSccp++;
      else if(/FBS/.test(tp))fstToFbs++;
      else fstOnly++;
    }
  });
  // status distribution
  const st={};
  persons_a.forEach(p=>{const s=p.current_status||'(未記入)';st[s]=(st[s]||0)+1;});
  let stRows='';
  Object.entries(st).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>{
    stRows+=`<tr><td>${k}</td><td class="num">${n}</td></tr>`;
  });
  // triggers count
  let trRows='';
  Object.entries(TRIGGERS).forEach(([name,fn])=>{
    trRows+=`<tr><td>${name}</td><td class="num">${persons_a.filter(fn).length}人</td></tr>`;
  });
  // channel effectiveness
  const ch={};
  persons_a.forEach(p=>{
    const c=p.channel||'(未記入)';
    ch[c]=ch[c]||{n:0,paid:0,active:0,lagSum:0,lagN:0};
    ch[c].n++;
    const tp=(tpsByPerson[p.id]||[]);
    if(tp.some(t=>t.fee&&t.fee!=='0'&&t.fee!=='¥0'))ch[c].paid++;
    if(p.current_status==='能動的に創造している'||p.current_status==='学び続けている')ch[c].active++;
    if(p.aware_year&&p.first_year){const lag=parseInt(p.first_year)-parseInt(p.aware_year);
      if(!isNaN(lag)&&lag>=0&&lag<20){ch[c].lagSum+=lag;ch[c].lagN++;}}
  });
  let chRows='';
  Object.entries(ch).sort((a,b)=>b[1].n-a[1].n).forEach(([k,s])=>{
    const lag=s.lagN?(s.lagSum/s.lagN).toFixed(1)+'年':'—';
    chRows+=`<tr><td>${k}</td><td class="num">${s.n}</td><td class="num">${s.paid} (${Math.round(s.paid/s.n*100)}%)</td><td class="num">${s.active}</td><td class="num">${lag}</td></tr>`;
  });
  // referrer ranking
  const rf={};
  persons_a.forEach(p=>{if(p.referrer)rf[p.referrer]=(rf[p.referrer]||0)+1;});
  let rfRows='';
  Object.entries(rf).sort((a,b)=>b[1]-a[1]).slice(0,15).forEach(([k,n])=>{
    rfRows+=`<tr><td>${k}</td><td class="num">${n}人</td></tr>`;
  });
  // ===== 3つの主要指標 × 施策年表 =====
  const tpOf=p=>(tpsByPerson[p.id]||[]);
  const y4=t=>((t.year||'').slice(0,4));
  const newByYear={}, secondByYear={}, revivalByYear={};
  persons_a.forEach(p=>{
    const ys=tpOf(p).map(y4).filter(Boolean).sort();
    if(!ys.length)return;
    newByYear[ys[0]]=(newByYear[ys[0]]||0)+1;
    // 2回目に進んだ人は「初回年」にカウント（入口の質として読む）
    if(ys.length>=2) secondByYear[ys[0]]=(secondByYear[ys[0]]||0)+1;
    // 復帰: 3年以上空いた次の接点があった年
    for(let i=1;i<ys.length;i++){
      const gap=parseInt(ys[i])-parseInt(ys[i-1]);
      if(gap>=3){ revivalByYear[ys[i]]=(revivalByYear[ys[i]]||0)+1; break; }
    }
  });
  const allYears=[...new Set([...Object.keys(newByYear),...Object.keys(revivalByYear)])].filter(y=>y>='2018').sort();
  const maxNew=Math.max(1,...Object.values(newByYear));
  const evByYear={};
  initiatives.forEach(i=>{const y=(i.ym||'').slice(0,4);(evByYear[y]=evByYear[y]||[]).push(i);});
  let coreRows='';
  allYears.forEach(y=>{
    const n=newByYear[y]||0, s=secondByYear[y]||0, r=revivalByYear[y]||0;
    const rate=n?Math.round(s/n*100):0;
    coreRows+=`<div class="yearbar"><span class="lbl">${y}</span>
      <span class="b1" style="width:${Math.round(n/maxNew*150)}px"></span>
      <span>新規 ${n}人 ・ 2回目へ ${s}人(${rate}%) ・ 復帰 ${r}人</span></div>`;
    (evByYear[y]||[]).forEach(i=>{ coreRows+=`<div class="yearev">▸ ${i.ym} ${i.title}</div>`; });
  });
  let tlRows='';
  initiatives.forEach(i=>{
    tlRows+=`<div class="tlrow"><span class="tlym">${i.ym}</span><span>${i.title}</span>`+
            (i.kind?`<span class="tlkind">${i.kind}</span>`:'')+
            `<span class="tldel" onclick="deleteInitiative(${i.id})">削除</span></div>`;
  });
  v.innerHTML=`
  <div class="insight"><h3>主要3指標 × 施策年表（何をした年に、何が動いたか）</h3>
    ${coreRows}
    <p style="font-size:11px;color:var(--gray);margin-top:10px">
    新規＝その年に初めて接点を持った人 ／ 2回目へ＝その年の新規のうち2回以上関わった人 ／ 復帰＝3年以上空いてから戻った人</p></div>
  <div class="insight"><h3>施策年表（RFC側で何をしたか）</h3>
    ${tlRows||'<p style="font-size:12px;color:var(--gray)">まだ登録がありません</p>'}
    <div class="tlform">
      <input id="iniYm" placeholder="2026-07" style="width:100px">
      <input id="iniTitle" placeholder="やったこと（例: SCCP募集をメルマガ配信）" style="flex:1;min-width:220px">
      <select id="iniKind">
        <option value="">種別</option><option>新規プログラム</option><option>新規施策</option>
        <option>募集案内</option><option>認知施策</option><option>イベント</option><option>体制変更</option><option>その他</option>
      </select>
      <button onclick="addInitiative()">追加</button>
    </div></div>
  <div class="insight"><h3>認知チャネル別の有効性（流入 → 有料転換 → アクティブ）</h3>
    <table><tr><th>チャネル</th><th>人数</th><th>有料講座へ</th><th>現在アクティブ</th><th>認知→接触の平均年数</th></tr>${chRows}</table>
    <p style="font-size:11px;color:var(--gray);margin-top:8px">※チャネル・現在の状態の記入が進むほど精度が上がります</p></div>
  <div class="insight"><h3>紹介ハブ（誰が人を連れてきているか）</h3>
    <table>${rfRows||'<tr><td colspan=2 style="color:var(--gray)">紹介者の記入がまだありません</td></tr>'}</table></div>
  <div class="insight"><h3>初回接触コホート（年別の新規と定着）</h3>
    <table><tr><th>初回年</th><th>新規</th><th></th><th>3接点以上</th><th>2025年以降も接点</th></tr>${cohortRows}</table></div>
  <div class="insight"><h3>FSTからの分岐（FST受講 ${fstTotal}人）</h3>
    <table>
      <tr><td>→ SCCPへ進んだ</td><td class="num">${fstToSccp}人 (${Math.round(fstToSccp/fstTotal*100)}%)</td></tr>
      <tr><td>→ FBSへ進んだ</td><td class="num">${fstToFbs}人 (${Math.round(fstToFbs/fstTotal*100)}%)</td></tr>
      <tr><td>→ FSTで止まっている</td><td class="num">${fstOnly}人 (${Math.round(fstOnly/fstTotal*100)}%)</td></tr>
    </table></div>
  <div class="insight"><h3>トリガー該当者数（名簿タブのオレンジのチップで一覧できます）</h3>
    <table>${trRows}</table></div>
  <div class="insight"><h3>現在の状態（記入済みの分布）</h3>
    <table>${stRows}</table></div>`;
}
</script>
</body>
</html>
